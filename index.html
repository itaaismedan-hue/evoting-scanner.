<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Voting OSIS AAIS Medan - Scanner</title>
    <!-- Tailwind CSS untuk tampilan rapi -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-100 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md text-center">
        <h1 class="text-xl font-bold text-green-800 mb-1">E-Voting OSIS AAIS Medan</h1>
        <p class="text-sm text-gray-600 mb-4">Arahkan QR Kartu Pemilih Anda ke kamera</p>

        <!-- Area Kamera / Scanner -->
        <div id="reader" class="w-full overflow-hidden rounded-xl border-2 border-dashed border-green-600 mb-4 bg-gray-50"></div>

        <!-- Status atau Pesan Hasil -->
        <div id="result-container" class="hidden p-3 mb-4 rounded-lg text-sm font-medium"></div>

        <!-- Tombol Alternatif Upload File -->
        <div class="mt-2 text-xs text-gray-500">
            Atau gunakan file gambar QR: <input type="file" id="qr-input-file" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100"/>
        </div>
    </div>

    <script>
        // GANTI URL DI BAWAH INI dengan URL Web App Google Apps Script Anda
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4bQHt71wXNt5toh9RsQMUoMEt-VD-WKDJvL1LTrIfVRzJRJKZGRfeEtgFBKmKvwIW/exec";

        function onScanSuccess(decodedText, decodedResult) {
            html5QrCode.stop().then((ignore) => {
                showStatus("QR Berhasil diproses: " + decodedText, "success");
                kirimKeBackend(decodedText);
            }).catch((err) => {
                console.error("Gagal menghentikan scanner: ", err);
            });
        }

        function showStatus(message, type) {
            const container = document.getElementById('result-container');
            container.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            if (type === 'success') {
                container.classList.add('bg-green-100', 'text-green-800');
            } else {
                container.classList.add('bg-red-100', 'text-red-800');
            }
            container.innerText = message;
        }

        function kirimKeBackend(token) {
            showStatus("Menghubungkan ke server...", "success");
            
            fetch(APPS_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ token: token })
            })
            .then(() => {
                showStatus("Token berhasil dikirim! Memuat ulang...", "success");
                setTimeout(() => {
                    location.reload();
                }, 2000);
            })
            .catch(error => {
                console.error('Error:', error);
                showStatus("Gagal mengirim data ke server.", "error");
            });
        }

        const html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
        .catch(err => {
            console.error("Gagal membuka kamera:", err);
            document.getElementById('reader').innerHTML = `<div class="p-6 text-red-600 text-sm">Gagal mengakses kamera. Silakan gunakan fitur Upload File di bawah.</div>`;
        });

        const fileInput = document.getElementById('qr-input-file');
        fileInput.addEventListener('change', e => {
            if (e.target.files.length == 0) return;
            const imageFile = e.target.files[0];
            
            html5QrCode.scanFile(imageFile, true)
            .then(decodedText => {
                showStatus("QR dari File Berhasil: " + decodedText, "success");
                kirimKeBackend(decodedText);
            })
            .catch(err => {
                showStatus("Tidak dapat membaca QR dari file tersebut.", "error");
            });
        });
    </script>
</body>
</html>
